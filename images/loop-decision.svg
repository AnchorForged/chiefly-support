<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 360" width="390" height="360" role="img" aria-label="Placeholder labeled Decision and outcome">
  <style>
    .bg { fill: #f3f3f3; }
    .frame { fill: none; stroke: #8a8a8a; stroke-width: 2; stroke-dasharray: 7 6; }
    .kicker { fill: #0a66c2; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; }
    .title { fill: #1a1a1a; font-size: 22px; font-weight: 700; }
    .sub { fill: #444; font-size: 15px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c1c1c; }
      .frame { stroke: #666; }
      .kicker { fill: #6ab0ff; }
      .title { fill: #f2f2f2; }
      .sub { fill: #bbb; }
    }
  </style>
  <rect class="bg" width="390" height="360"/>
  <rect class="frame" x="16" y="16" width="358" height="328" rx="28"/>
  <text class="kicker" x="195" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">OUTCOME</text>
  <text class="title" x="195" y="186" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Decision and outcome</text>
  <text class="sub" x="195" y="216" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">The call, then what happened</text>
</svg>
